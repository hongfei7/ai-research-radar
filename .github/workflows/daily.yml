name: radar-scan
on:
  schedule:
    - cron: "*/15 * * * *"        # 每 15 分钟（抓重要事件），兜底在 :40 每 2 小时推送
  workflow_dispatch:
concurrency:
  group: radar-scan               # 防止重叠运行，新触发会排队
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120           # 首跑 60-80min，增量跑 3-5min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python main.py --stage full
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/ai-research-radar', github.repository_owner) }}
      - name: commit state & archive
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          # 先提交本地变更, 再 rebase 到远端 —— 绝不能 reset --hard,
          # 那会丢弃本轮管道对 tracked 文件(state/ README.md)的全部修改
          git add archive/ state/ README.md docs/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "radar: $(date -u +%Y-%m-%dT%H:%M)"
          pushed=0
          for i in 1 2 3; do
            git fetch origin main
            # -X theirs: rebase 语义中 theirs = 正在回放的本地提交,
            # 冲突时优先本地(本轮管道产物最新), 避免人工介入
            if git rebase -X theirs origin/main; then
              if git push; then
                pushed=1; break
              fi
            else
              git rebase --abort
            fi
            echo "push failed (attempt $i), retrying after 5s..."
            sleep 5
          done
          if [ $pushed -eq 0 ]; then
            echo "::error ::Failed to push after 3 attempts"
            exit 1
          fi
